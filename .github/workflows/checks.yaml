name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          prune-cache: true
      - run: uv python install 3.12
      - run: uv sync --project apps/backend --locked
      - run: make check-be
      - run: make compose-check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: make check-web

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          prune-cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --project apps/backend --locked
      - run: npm --prefix apps/web ci
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: make check-e2e
