name: email-agentic

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-email_agentic}
      POSTGRES_USER: ${POSTGRES_USER:-email_agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local configuration}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 128mb
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  neo4j:
    image: neo4j:2026.09.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD (at least 8 characters)}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    mem_limit: 1536m
    healthcheck:
      test:
        - CMD-SHELL
        - 'NEO4J_USERNAME=neo4j NEO4J_PASSWORD="$${NEO4J_AUTH#*/}" cypher-shell -a bolt://localhost:7687 "RETURN 1" >/dev/null 2>&1'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  app:
    profiles: [app]
    build: .
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      POSTGRES_DSN: ${COMPOSE_POSTGRES_DSN:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in local configuration}
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  lgtm:
    profiles: [observability]
    image: grafana/otel-lgtm:0.36.0
    command:
      - /bin/bash
      - -ec
      - ': "$${GF_SECURITY_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before starting observability}"; exec /otel-lgtm/run-all.sh'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - lgtm-data:/data
    mem_limit: 2g

volumes:
  postgres-data:
  neo4j-data:
  lgtm-data:
